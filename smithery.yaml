# Smithery listing for the Pulse Verity Index MCP server.
# A stdio server published on npm as `pulse-verity`.
#
# The API key is OPTIONAL. With no key the server starts and answers
# get_index_price with limited BTC, ETH and SOL samples, signed and
# verifiable exactly like a keyed read; verify_print also works without a key.
# A developer key from https://thepulse.markets/developers (Developer plan,
# no charge) adds catalogue discovery, batch reads and recorded prints,
# subject to the account's allowance.
startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      pulseApiKey:
        type: string
        title: Pulse API key (optional)
        description: >-
          Optional. Leave blank for limited BTC, ETH and SOL samples. For
          broader requests, use your own developer key from
          https://thepulse.markets/developers (Developer plan, no charge).
          Access, coverage and usage allowances depend on your account.
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'pulse-verity'],
      env: (config && config.pulseApiKey)
        ? { PULSE_API_KEY: config.pulseApiKey }
        : {}
    })

name: Claude plugin

on:
  push:
    branches: [main, codex/claude-code-plugin]
  pull_request:
  workflow_dispatch:
    inputs:
      live_sample:
        description: Read one keyless BTC observation and verify its receipt
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node scripts/claude-plugin-test.mjs
      - name: Install pinned official Claude validator
        run: npm install --global @anthropic-ai/claude-code@2.1.271
      - name: Validate plugin with Claude Code
        run: claude plugin validate . --strict
      - name: Load the local plugin without a model call
        run: |
          claude --plugin-dir "$GITHUB_WORKSPACE" plugin list --json > "$RUNNER_TEMP/verity-claude-plugin-list.json"
          cat "$RUNNER_TEMP/verity-claude-plugin-list.json"
          node scripts/claude-plugin-test.mjs --cli-list "$RUNNER_TEMP/verity-claude-plugin-list.json"
          claude --plugin-dir "$GITHUB_WORKSPACE" plugin details pulse-verity@inline > "$RUNNER_TEMP/verity-claude-plugin-details.txt"
          cat "$RUNNER_TEMP/verity-claude-plugin-details.txt"
          node scripts/claude-plugin-test.mjs --cli-details "$RUNNER_TEMP/verity-claude-plugin-details.txt"
      - run: npm ci --ignore-scripts
      - name: Check published keyless stdio package
        run: node scripts/claude-plugin-smoke.mjs
      - name: Verify one live sample when requested
        if: github.event_name == 'workflow_dispatch' && inputs.live_sample
        run: node scripts/claude-plugin-smoke.mjs --live

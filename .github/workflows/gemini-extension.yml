name: Gemini extension

on:
  push:
    branches: [main, codex/gemini-cli-discovery]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_assets:
        description: Attach new Gemini archives to the existing package release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Stage minimal Gemini archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verity-gemini/stage" "$RUNNER_TEMP/verity-gemini/assets"
          cp gemini-extension.json README.md LICENSE SECURITY.md "$RUNNER_TEMP/verity-gemini/stage/"
          for platform in darwin linux win32; do
            tar -czf "$RUNNER_TEMP/verity-gemini/assets/$platform.pulse-verity.tar.gz" \
              -C "$RUNNER_TEMP/verity-gemini/stage" gemini-extension.json README.md LICENSE SECURITY.md
            tar -tzf "$RUNNER_TEMP/verity-gemini/assets/$platform.pulse-verity.tar.gz"
          done
      - name: Install Gemini CLI
        timeout-minutes: 3
        run: npm install --global @google/gemini-cli@0.59.0
      - name: Validate installation with Gemini CLI
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          # Approve only the reviewed, ephemeral extension folder staged above.
          printf 'y\n' | gemini extensions install "$RUNNER_TEMP/verity-gemini/stage" --consent --skip-settings
          gemini extensions list
      - name: Check installed MCP tools
        timeout-minutes: 2
        run: |
          node scripts/gemini-extension-smoke.mjs "$HOME/.gemini/extensions/pulse-verity/gemini-extension.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gemini-archives
          path: ${{ runner.temp }}/verity-gemini/assets/*.tar.gz
          if-no-files-found: error

  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.publish_assets && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gemini-archives
          path: archives
      - name: Attach Gemini archives without replacing existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tar -xOzf archives/linux.pulse-verity.tar.gz gemini-extension.json | jq -r .version)"
          gh release view "v$version" --repo "$GITHUB_REPOSITORY"
          gh release upload "v$version" archives/darwin.pulse-verity.tar.gz \
            archives/linux.pulse-verity.tar.gz archives/win32.pulse-verity.tar.gz --repo "$GITHUB_REPOSITORY"

  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Install Gemini CLI
        timeout-minutes: 3
        run: npm install --global @google/gemini-cli@0.59.0
      - name: Test the default public Gemini installation and keyless tools
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          gemini extensions install "https://github.com/$GITHUB_REPOSITORY" --consent --skip-settings
          gemini extensions list
          node scripts/gemini-extension-smoke.mjs "$HOME/.gemini/extensions/pulse-verity/gemini-extension.json" --live

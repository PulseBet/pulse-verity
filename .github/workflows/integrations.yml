name: Integration examples

on:
  pull_request:
    paths:
      - 'integrations/**'
      - '.github/workflows/integrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-examples-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate n8n failure and verification paths
        run: node --test integrations/n8n/validate.mjs
      - name: Validate framework contract boundaries offline
        run: python -m unittest discover -s integrations/python/tests -p 'test_*.py' -v
      - name: Install Dify test dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/dify/requirements.txt
      - name: Validate Dify SDK registration and mocked transport
        working-directory: integrations/dify
        run: python -m unittest discover -s tests -v

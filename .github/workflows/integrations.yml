name: Integration examples

on:
  pull_request:
    paths:
      - 'integrations/**'
      - '.github/workflows/integrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-examples-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate n8n failure and verification paths
        run: node --test integrations/n8n/validate.mjs integrations/n8n/validate-monitor.mjs
      - name: Validate framework contract boundaries offline
        run: python -m unittest discover -s integrations/python/tests -p 'test_*.py' -v
      - name: Install Dify test dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/dify/requirements.txt
      - name: Validate Dify SDK registration and mocked transport
        working-directory: integrations/dify
        run: python -m unittest discover -s tests -v

  framework-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_DEFAULT_TIMEOUT: '20'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TELEMETRY_ENABLED: 'false'
      CREWAI_TRACING_ENABLED: 'false'
      CREWAI_TESTING: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Separate environments are required: these frameworks use different MCP
      # major versions. SDK installs happen on this runner, never a local build.
      - name: Run pinned SDK lifecycle checks in isolated environments
        shell: bash
        run: |
          set -euo pipefail
          result=0
          for framework in google-adk langchain crewai; do
            environment="$RUNNER_TEMP/verity-$framework"
            python -m venv "$environment"
            if ! timeout 240s "$environment/bin/python" -m pip install --retries 1 -r "integrations/python/requirements-$framework.txt"; then
              result=1
              continue
            fi
            if [[ "$framework" == crewai ]]; then
              if ! timeout 90s "$environment/bin/python" -m pip install --retries 1 --no-deps ./integrations/python; then
                result=1
                continue
              fi
              if ! timeout 30s "$environment/bin/python" -I integrations/python/runtime_tests/validate_crewai_package.py; then
                result=1
              fi
            fi
            if ! "$environment/bin/python" -m pip check; then
              result=1
            fi
            test_name="${framework//-/_}"
            if ! timeout 60s "$environment/bin/python" -m unittest discover -s integrations/python/runtime_tests -p "test_$test_name.py" -v; then
              result=1
            fi
          done
          exit "$result"

  langflow-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_DEFAULT_TIMEOUT: '20'
      DO_NOT_TRACK: 'true'
      LANGFLOW_DO_NOT_TRACK: 'true'
      LANGSMITH_TRACING: 'false'
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check the exported Core component graph offline
        run: python integrations/langflow/validate.py
      - name: Install pinned Langflow on this disposable runner
        run: timeout 360s python -m pip install --retries 1 'langflow==1.12.5'
      - name: Load the real graph and test mocked read and error paths
        run: timeout 90s python integrations/langflow/validate_runtime.py
